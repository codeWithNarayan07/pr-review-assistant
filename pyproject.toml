[project]
name = "pr-review-assistant"
version = "1.0.0"
description = "GitHub bot that posts an AI-assisted first-pass review briefing on pull requests"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
